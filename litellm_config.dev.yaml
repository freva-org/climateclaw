      reasoning_effort: none
  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: "os.environ/CLIMATECLAW_OPENAI_API_KEY"
  - model_name: "gemma4:31b"
    litellm_params:
      model: "ollama_chat/gemma4:31b"
