model_list:
  - model_name: "deepseek-v4.1"
    litellm_params:
      model: "os.environ/CLIMATECLAW_VLLM_LITELLM_MODEL"
      api_base: "os.environ/CLIMATECLAW_VLLM_API_BASE"
      api_key: "os.environ/CLIMATECLAW_VLLM_API_KEY"
    model_info:
      supports_function_calling: true

litellm_settings:
  drop_params: true

general_settings:
  # The master key comes from LITELLM_MASTER_KEY (see docker-compose.dev.yml):
  # with an API key in .env, auth is on; without one, the proxy runs without auth.
  dangerously_permit_weak_or_unset_master_key: true
