services:

  climateclaw-base:
    # Build manually with:
    # docker compose -f docker-compose.dev.yml --profile build-only build climateclaw-base
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    image: ghcr.io/freva-org/climateclaw-base:latest
    profiles:
      - build-only

  climateclaw:
    image: climateclaw-${CLIMATECLAW_INSTANCE_NAME:?Instance name must be set in the .env file to differentiate between instances}
    build:
      context: .
      dockerfile: docker/climateclaw/Dockerfile
    env_file: .env
    hostname: climateclaw-${CLIMATECLAW_INSTANCE_NAME}
    ports:
      - "${CLIMATECLAW_TARGET_PORT:-8502}:${CLIMATECLAW_BACKEND_PORT:-8502}" # If either is unset, the default value will be used.
    volumes:
      - /work:/work:ro
      - /pool/data:/pool/data:ro
      - /container/da/climateclaw-links/${CLIMATECLAW_INSTANCE_NAME}/logs:/app/logs
    networks:
      - climateclaw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${CLIMATECLAW_BACKEND_PORT:-8502}/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      litellm:
        condition: service_healthy

  code-server:
    image: code-server-${CLIMATECLAW_INSTANCE_NAME}
    build:
      context: .
      dockerfile: docker/code-server/Dockerfile
    env_file: .env
    hostname: code-server-${CLIMATECLAW_INSTANCE_NAME}
    environment:
      CLIMATECLAW_MCP_HOST: 0.0.0.0
      CLIMATECLAW_MCP_PORT: 8051
    volumes:
      - /work:/work:ro
      - /pool/data:/pool/data:ro
      - /container/da/climateclaw-links/${CLIMATECLAW_INSTANCE_NAME}/logs:/app/logs
    cpus: 4
    networks:
      - climateclaw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8051/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web-search-server:
    image: web-search-server-${CLIMATECLAW_INSTANCE_NAME}
    build:
      context: .
      dockerfile: docker/web-search-server/Dockerfile
    env_file: .env
    hostname: web-search-server-${CLIMATECLAW_INSTANCE_NAME}
    environment:
      CLIMATECLAW_MCP_HOST: 0.0.0.0
      CLIMATECLAW_MCP_PORT: 8052
    networks:
      - climateclaw
    volumes:
      - /container/da/climateclaw-links/${CLIMATECLAW_INSTANCE_NAME}/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8052/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    hostname: litellm-${CLIMATECLAW_INSTANCE_NAME}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml # Mount the local litellm_config.yaml file to the container
      - /container/da/climateclaw-links/${CLIMATECLAW_INSTANCE_NAME}/logs:/app/logs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        litellm
        --config=/app/config.yaml
        --port=4000
        --num_workers=8
        --run_gunicorn
        2>&1 | tee -a /app/logs/litellm.log
    env_file: .env
    networks:
      - climateclaw
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vllm:
    image: docker.io/vllm/vllm-openai:latest
    hostname: vllm-${CLIMATECLAW_INSTANCE_NAME}
    volumes:
      - /container/da/climateclaw-vllm-models:/root/.cache/huggingface
    networks:
      - climateclaw
    devices:
      - nvidia.com/gpu=all
    shm_size: "2gb"
    environment:
      VLLM_LOGGING_LEVEL: DEBUG
    command:
      - ${CLIMATECLAW_VLLM_MODEL_ID:-nvidia/Gemma-4-31B-IT-NVFP4}
      - --quantization
      - modelopt
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --data-parallel-size
      - "4"  # Four complete model replicas
      - --max-model-len
      - "131072" # vLLM 0.29 has prefix caching enabled by default. vLLM can reuse the cached KV for system prompt (~20-25k)
      # - --kv-cache-dtype  # memory vs precision but the model weights are alread FP4
      # - fp8  # model default BF16
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --chat-template
      - examples/tool_chat_template_gemma4.jinja
      - --enable-log-requests
      - --enable-log-outputs
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 600s

  ollama: # Ollama is only for the backend and not accessible from the outside. Port 11434 is not exposed.
    image: ollama/ollama:latest
    hostname: ollama-${CLIMATECLAW_INSTANCE_NAME}
    volumes:
      - /container/da/climateclaw-ollama-models/.ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${CLIMATECLAW_OLLAMA_KEEP_ALIVE:--1}
    networks:
      - climateclaw
    devices:
      - nvidia.com/gpu=all

networks:
  climateclaw:
    driver: bridge
