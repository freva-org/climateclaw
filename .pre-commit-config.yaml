repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: mypy-pre-push
        name: mypy before push
        entry: uv run --group type mypy
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-pre-push
        name: pytest before push
        entry: uv run --group test pytest -m "not integration"
        language: system
        pass_filenames: false
        stages: [pre-push]
