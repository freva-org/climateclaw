repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: mypy-pre-push
        name: mypy before push
        entry: uv run mypy
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-pre-push
        name: pytest before push
        entry: bash -c 'set -e; ./dev.sh up code web-search -d --wait --build --remove-orphans; trap "docker compose -f docker-compose.dev.yml down -v" EXIT; uv run pytest'
        language: system
        pass_filenames: false
        stages: [pre-push]
