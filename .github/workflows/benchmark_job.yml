name: Benchmark

on:
  pull_request:
    paths:
      - "src/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      base:
        description: "Base: branch, tag or commit to compare against"
        default: "main"
      head:
        description: "Head: branch, tag or commit to benchmark (empty = the branch this runs on)"
        default: ""
      concurrency:
        description: "Comma-separated numbers of concurrent users"
        default: "1,4,16,64"
      duration:
        description: "Seconds measured per concurrency level"
        default: "20"
      workers:
        description: "Backend uvicorn workers"
        default: "1"

permissions:
  contents: read

jobs:
  backend:
    name: Backend throughput (base vs head)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write  # to post the comparison comment
    env:
      # Inputs are passed through env, not interpolated into scripts.
      BASE_REF: ${{ github.base_ref || inputs.base || 'main' }}
      # Name shown in the report, and what is checked out for it. On PRs the
      # head is the PR's latest commit (not GitHub's merge commit).
      HEAD_NAME: ${{ github.head_ref || inputs.head || github.ref_name }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || inputs.head || github.sha }}
      CONCURRENCY: ${{ inputs.concurrency || '1,4,16,64' }}
      DURATION: ${{ inputs.duration || '20' }}
      BENCH_WORKERS: ${{ inputs.workers || '1' }}

    steps:
      # The benchmark harness (benchmarks/) comes from the ref the workflow
      # runs on; base and head only provide the backend code under test, so
      # they need no benchmark code of their own.
      - name: Checkout benchmark harness
        uses: actions/checkout@v4

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_REF }}
          path: .bench-base

      - name: Checkout head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.HEAD_REF }}
          path: .bench-head

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: |
          uv sync --group dev
          uv sync --project .bench-base
          uv sync --project .bench-head

      - name: Benchmark base
        env:
          BENCH_PROJECT_ROOT: .bench-base
        run: |
          benchmarks/backend/run.sh -c "${CONCURRENCY}" -d "${DURATION}" \
            --json base.json

      - name: Benchmark head
        env:
          BENCH_PROJECT_ROOT: .bench-head
        run: |
          benchmarks/backend/run.sh -c "${CONCURRENCY}" -d "${DURATION}" \
            --json head.json

      - name: Compare
        run: |
          uv run python benchmarks/backend/compare.py base.json head.json \
            --base-name "${BASE_REF}" --base-sha "$(git -C .bench-base rev-parse HEAD)" \
            --head-name "${HEAD_NAME}" --head-sha "$(git -C .bench-head rev-parse HEAD)" \
            --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" > comment.md
          {
            cat comment.md
            echo
            echo "Backend workers: ${BENCH_WORKERS}, ${DURATION}s per level, runner: $(nproc) CPUs."
          } >> "$GITHUB_STEP_SUMMARY"

      # Token of PRs from forks is read-only; those only get the job summary.
      - name: Post or update PR comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- climateclaw-backend-benchmark -->'
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [ -n "${id}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
              -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -F body=@comment.md > /dev/null
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-benchmark
          path: |
            base.json
            head.json
            comment.md
          if-no-files-found: ignore
