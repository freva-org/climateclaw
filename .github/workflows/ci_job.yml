name: CI

permissions:
  contents: read

on: [push, pull_request, workflow_call]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  dev-tests:
    name: Full test suite on dev stack (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Create CI .env
        run: |
          cat > .env <<'EOF'
          FREVAGPT_INSTANCE_NAME=ci
          EOF

      - name: Sync dependencies
        run: uv sync --group dev --group test --group type

      - name: Start dev stack
        run: ./dev.sh up code -d --wait --build --remove-orphans

      - name: Run mypy
        run: uv run --group type mypy

      - name: Run pytest
        run: uv run --group test pytest

      - name: Tear down dev stack
        if: always()
        run: ./dev.sh down -v

  prod-smoke:
    name: Production smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create CI .env
        run: |
          cat > .env <<'EOF'
          FREVAGPT_INSTANCE_NAME=ci
          EOF

      - name: Start production stack
        run: docker compose up freva-gpt -d --wait --build --remove-orphans

      - name: Show running services
        run: docker compose ps

      - name: Smoke check public surface
        run: |
          curl -f http://localhost:8502/healthz

      - name: Tear down production stack
        if: always()
        run: docker compose down -v
