name: CI

permissions:
  contents: read

on: [push, pull_request, workflow_call]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  prod-tests:
    name: CI tests on production setup (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --group dev --group test --group type

      - name: Start production stack
        run: ./prod.sh up -d --wait --build --remove-orphans

      - name: Run mypy
        run: uv run --group type mypy

      - name: Run pytest
        run: uv run --group test pytest

      - name: Tear down production stack
        if: always()
        run: ./prod.sh down -v
