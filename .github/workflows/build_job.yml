name: Build and publish the images
run-name: ${{ github.actor }} is creating a new release

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      rc:
        description: "Release candidate number for this release."
        required: true
        type: number

  push:
    tags:
      - "v*.*.*"

jobs:
  ci:
    name: Run CI first
    uses: ./.github/workflows/ci_job.yml
    secrets: inherit

  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: freva-gpt
            dockerfile: ./docker/freva-gpt/Dockerfile
            context: .
          - image: code-server
            dockerfile: ./docker/code-server/Dockerfile
            context: .
          - image: web-search-server
            dockerfile: ./docker/web-search-server/Dockerfile
            context: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            ADD_LATEST="true"
          else
            LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)
            if [[ -z "${LATEST_TAG}" ]]; then
              echo "No final release tag found matching v*.*.*"
              exit 1
            fi
            VERSION="${LATEST_TAG}-rc${{ inputs.rc }}"
            ADD_LATEST="false"
          fi

          echo "IMAGE=ghcr.io/${OWNER}/${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ADD_LATEST=${ADD_LATEST}" >> "$GITHUB_ENV"

      - name: Prepare docker tags
        run: |
          if [[ "${ADD_LATEST}" == "true" ]]; then
            {
              echo 'TAGS<<EOF'
              echo "${IMAGE}:${VERSION}"
              echo "${IMAGE}:latest"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          else
            echo "TAGS=${IMAGE}:${VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.TAGS }}
