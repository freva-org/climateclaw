services:
  freva-gpt-backend:
    image: freva-gpt-backend-${FREVAGPT_INSTANCE_NAME:?Instance name must be set in the .env file to differentiate between instances}
    build:
      context: .
      dockerfile: docker/freva-gpt-backend/Dockerfile
    env_file: .env
    environment:
      FREVAGPT_DEV: ${FREVAGPT_DEV}
      FREVAGPT_DEBUG: ${FREVAGPT_DEBUG:-0}
    hostname: freva-gpt-backend-instance-${FREVAGPT_INSTANCE_NAME}
    ports:
      - "${FREVAGPT_TARGET_PORT:-8502}:${FREVAGPT_BACKEND_PORT:-8502}" # If either is unset, the default value will be used.
      - "8600:${FREVAGPT_BACKEND_PORT:-8502}" # This is to listen to the backend port without and frontend. localhost:8600/docs give FastAPI docs
      - "${FREVAGPT_DEBUG_PORT:-5678}:${FREVAGPT_DEBUG_PORT:-5678}" # Port for debugpy
    volumes: 
      - ./cache/:/app/cache
      - ./logs/:/app/logs
    networks: 
      - freva-gpt
  rag:
    image: rag-server-${FREVAGPT_INSTANCE_NAME}
    build:
      context: .
      dockerfile: docker/rag-server/Dockerfile
    env_file: .env
    environment:
      FREVAGPT_DEV: ${FREVAGPT_DEV}
      FREVAGPT_DEBUG: ${FREVAGPT_DEBUG:-0}
      FREVAGPT_MCP_HOST: 0.0.0.0
      FREVAGPT_MCP_PORT: 8050
    volumes: 
      - ./resources:/app/resources:ro
      - ./logs/:/app/logs
    networks: 
      - freva-gpt
  code:
    image: code-server-${FREVAGPT_INSTANCE_NAME}
    build:
      context: .
      dockerfile: docker/code-server/Dockerfile
    env_file: .env
    environment:
      FREVAGPT_DEV: ${FREVAGPT_DEV}
      FREVAGPT_DEBUG: ${FREVAGPT_DEBUG:-0}
      FREVAGPT_MCP_HOST: 0.0.0.0
      FREVAGPT_MCP_PORT: 8051
    ports: 
      - 8051:8051
    volumes:
      - ./cache/:/app/cache
      - ./logs/:/app/logs
    networks: 
      - freva-gpt
  web-search:
    image: web-search-server-${FREVAGPT_INSTANCE_NAME}
    build:
      context: .
      dockerfile: docker/web-search-server/Dockerfile
    env_file: .env
    environment:
      FREVAGPT_DEV: ${FREVAGPT_DEV}
      FREVAGPT_DEBUG: ${FREVAGPT_DEBUG:-0}
      FREVAGPT_MCP_HOST: 0.0.0.0
      FREVAGPT_MCP_PORT: 8052
    ports: 
      - 8052:8052
    networks: 
      - freva-gpt
    volumes:
      - ./logs/:/app/logs
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    hostname: litellm-instance-${FREVAGPT_INSTANCE_NAME}
    volumes: 
      - ./litellm_config.yaml:/app/config.yaml # Mount the local litellm_config.yaml file to the container
    command: "--config=/app/config.yaml"
    env_file: .env 
    ports: 
      - "4000:4000" # Expose LiteLLM port to the host machine for direct access if needed, e.g. local dev
    networks: 
      - freva-gpt
  ollama:
    image: ollama/ollama:latest
    hostname: ollama-instance-${FREVAGPT_INSTANCE_NAME}
    networks: 
      - freva-gpt
  mongodb:
    networks:
      - freva-gpt
    image: ghcr.io/freva-org/freva-mongo:latest
    environment:
      - API_MONGO_USER=${FREVAGPT_MONGODB_USER:?MongoDB user and password must be set in the .env file. See .env.example.}
      - API_MONGO_PASSWORD=${FREVAGPT_MONGODB_PASSWORD}
      - API_MONGO_DB=${FREVAGPT_MONGODB_DATABASE_NAME}
    hostname: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    tty: True
    healthcheck:
      test: ["CMD", "healthchecks", "-s", "mongo"]
      interval: 35s
      timeout: 2s
      retries: 3
      start_period: 15s


  freva-db:
    networks:
      - freva-gpt
    hostname: freva-db
    container_name: freva-db
    image: ghcr.io/freva-org/freva-mysql:9.3.0
    environment:
      - ROOT_PW=T3st
      - HOST=localhost
      - PROJECT=freva-dev
      - MYSQL_USER=freva
      - MYSQL_PASSWORD=T3st
      - MYSQL_DATABASE=frevadb
      - MYSQL_ROOT_PASSWORD=test_password_please_ignore
    ports:
      - "3306:3306"

  freva-vault:
    networks:
      - freva-gpt
    image: ghcr.io/freva-org/freva-vault:latest
    hostname: freva-vault
    container_name: freva-vault
    cap_add:
      - IPC_LOCK
      - SYS_NICE
    environment:
      - ROOT_PW=T3st
      - KEY_FILE=/vault/file/keys
      - VAULT_ADD_VAR_DB_DB=frevadb
      - VAULT_ADD_VAR_DB_HOST=freva-db
      - VAULT_ADD_VAR_DB_PASSWD=T3st
      - VAULT_ADD_VAR_MONGO_DB=search_stats
      - VAULT_ADD_VAR_MONGO_PASSWD=secret
      - VAULT_ADD_VAR_MONGO_USER=mongo
      - VAULT_ADD_VAR_MONGO_URL='mongodb://mongo:secret@freva-mongo:27017'

  freva-web:
    networks:
      - freva-gpt
    image: ghcr.io/freva-org/freva-web:2604.1.1
    ports:
      - "8000:8000"
    container_name: freva-web
    hostname: freva-web
    environment:
      - EVALUATION_SYSTEM_CONFIG_FILE=/data/evaluation_system.conf
      - DJANGO_SUPERUSER_PASSWORD=T3st
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - SCHEDULER_HOST=localhost
      - REDIS_HOST=freva-cache
      - CSRF_TRUSTED_ORIGINS=http://127.0.0.1,http://localhost
      - FREVA_REST_URL=http://restapi:7777
      - CHAT_BOT_URL=http://freva-gpt-backend:8502
      - ACTIVATE_CHAT_BOT=1
      - STAC_BROWSER=1
      - DEV_MODE=1
      - CHAT_BOT=1
    volumes:
      - ./docker/freva.conf:/data/evaluation_system.conf

  freva-cache:
    networks:
      - freva-gpt
    image: ghcr.io/freva-org/freva-redis:latest
    hostname: freva-cache
    container_name: freva-cache

  volume-prep:
    image: docker.io/python:3-alpine
    user: 0:0
    hostname: volume-prep
    restart: "no"
    command:  find /settings -mindepth 1 -maxdepth 1 -exec rm -rf {} +
    volumes:
      - settings-data:/settings:rw

  git-prep:
    image: docker.io/alpine/git
    user: 0:0
    hostname: git-prep
    restart: "no"
    depends_on:
      volume-prep:
        condition: service_completed_successfully
    command: ["clone", "--depth", "1", "https://github.com/freva-org/freva-service-config.git", "/settings"]
    volumes:
      - settings-data:/settings:rw

  prep:
    image: docker.io/python:3-alpine
    user: 0:0
    hostname: prep
    restart: "no"
    depends_on:
      git-prep:
        condition: service_completed_successfully
    command: >
        sh -eu -c '
          ls -rlt /settings &&
          python /settings/dev-utils.py gen-certs --cert-dir /certs &&
          cp -a /settings/keycloak/import/. /import/
        '
    volumes:
      - settings-data:/settings:ro
      - certs-data:/certs:rw
      - import-data:/import:rw

  solr:
    networks:
      - freva-gpt
    image: ghcr.io/freva-org/freva-solr:latest
    ports:
      - "8983:8983"
    hostname: solr
    healthcheck:
      test: ["CMD", "healthchecks", "-s", "solr"]
      interval: 35s
      timeout: 2s
      retries: 3
      start_period: 15s

  keycloak:
    networks:
      freva-gpt:
        aliases:
          - keycloak.localhost
    image: quay.io/keycloak/keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_PASSWORD: secret
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Djava.net.preferIPv4Stack=true"
    depends_on:
      prep:
        condition: service_completed_successfully
    hostname: keycloak
    volumes:
      - certs-data:/certs:ro
      - import-data:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    command: |
         start-dev
         --hostname-strict=false
         --hostname=http://keycloak.localhost:8080
         --import-realm
         -Dkeycloak.migration.strategy=OVERWRITE_EXISTING

  keycloak-bootstrap:
    image: docker.io/alpine
    restart: "no"
    depends_on:
      - keycloak
    environment:
      USER: ${USER}
      KEYCLOAK_ADMIN: keycloak
      KEYCLOAK_ADMIN_PASSWORD: secret
      KEYCLOAK_HOST: keycloak:8080
    command: >
      /bin/sh -c '
        set -eu &&
        apk add --no-cache curl jq ca-certificates &&
        curl -fsSL \
          "https://raw.githubusercontent.com/freva-org/freva-nextgen/refs/heads/main/dev-env/create-user.sh"\
          -o create_user.sh &&
        sh create_user.sh
      '
    networks:
      - freva-gpt

  freva-rest-server:
    user: root
    image: ghcr.io/freva-org/freva-rest-api:latest
    hostname: restapi
    networks:
      - freva-gpt
    environment:
      - API_SOLR_CORE=files
      - API_PORT=7777
      - COLUMNS=140
      - API_OIDC_CLIENT_ID=freva
      - API_OIDC_DISCOVERY_URL=http://keycloak.localhost:8080/realms/freva/.well-known/openid-configuration
      - API_OIDC_TOKEN_CLAIMS=admin
      - API_ADMIN_CLAIMS=${USER}
      - API_OIDC_SYSTEMUSER_CLAIM=preferred_username
      - API_OIDC_TRUSTED_ISSUERS=https://www.freva.dkrz.de
      - API_REDIS_USER=redis
      - API_REDIS_PASSWORD=secret
      - API_REDIS_HOST=redis://freva-cache:6379
      - API_LOGDIR=/tmp/logs
      - API_SOLR_HOST=http://solr:8983
      - API_MONGO_USER=${FREVAGPT_MONGODB_USER}
      - API_MONGO_HOST=mongodb:27017
      - API_MONGO_PASSWORD=${FREVAGPT_MONGODB_PASSWORD}
      - API_MONGO_DB=search_stats
      - API_SERVICES=databrowser,stacapi
    depends_on:
      solr:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
    ports:
      - 7777:7777
    command: ["--redis-ssl-certdir", "/certs"]
    volumes:
      - certs-data:/certs:ro

networks:
  freva-gpt:
    driver: bridge

# The subnet is not set to avoid conflicts with other potentially running networks on the same machine.
# Note: Named networks by default aren't shared between different docker-compose projects, even if they have the same name, as long as they are in separate directories.

volumes:
  settings-data:
  certs-data:
  import-data:
